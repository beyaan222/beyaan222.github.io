<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>beyaan222</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Reem+Kufi:wght@600&family=Amiri:wght@400;700&display=swap">
<style>
  /* Layout: one quiet reading column on the page's own paper, bilingual (English, then Arabic RTL) */
  :root {
    --paper: #efe4cf; --ink: #1d1812; --muted: #5d5a3f; --clay: #8a6a45; --rule: #cdb994;
    --display: "Reem Kufi", "Geeza Pro", sans-serif;
    --body: "Literata", Georgia, serif;
    --arabic: "Amiri", "Geeza Pro", serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --paper: #1c1814; --ink: #ece2cf; --muted: #b8ae8c; --clay: #c9a275; --rule: #3d342a; color-scheme: dark } }
  :root[data-theme="dark"] { --paper: #1c1814; --ink: #ece2cf; --muted: #b8ae8c; --clay: #c9a275; --rule: #3d342a; color-scheme: dark }
  body { background: var(--paper); color: var(--ink); font: 1.0625rem/1.65 var(--body);
    margin:0; padding: 3rem 16px 4rem; }
  main { max-width: 40rem; margin: 0 auto; display: grid; gap: 1.75rem; }
  .mark { font-family: var(--display); color: var(--clay); font-size: 1.05rem; letter-spacing: .04em; }
  h1 { font: 600 2rem/1.2 var(--body); margin: 0; text-wrap: balance; }
  h2 { font: 600 1.15rem/1.3 var(--body); margin: 0 0 .4rem; color: var(--muted); }
  p { margin: 0; }
  .meta { color: var(--muted); font-size: .9rem; }
  section { display: grid; gap: .25rem; }
  a { color: var(--clay); text-underline-offset: 3px; }
  a:focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; }
  .ar { direction: rtl; text-align: right; font: 1.2rem/1.9 var(--arabic); border-top: 1px solid var(--rule); padding-top: 1.75rem; display: grid; gap: .5rem; }
  .ar h2 { font: 700 1.3rem/1.4 var(--arabic); color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="mark">بيان ٢٢٢ · beyaan222</div>
  <h1>بيان ٢٢٢</h1>
  <p>A page of classical Arabic poetry on <a href="https://www.instagram.com/beyaan222/">Instagram</a> and TikTok. صفحة أبيات من عيون الشعر العربي.</p>

</html>
